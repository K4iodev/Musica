name: Build KAIO MUSIC

on:
  workflow_dispatch:
  push:
    paths:
      - projeto.zip
      - .github/workflows/build.yml

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar projeto
        shell: bash
        run: |
          mkdir -p logs
          unzip -q projeto.zip -d app
          cd app
          flutter create --platforms=android,windows --project-name kaio_music --org com.kaio . 2>&1 | tee ../logs/create.txt
          rm -f test/widget_test.dart
          if [ -f tool/ci_prepare.sh ]; then bash tool/ci_prepare.sh 2>&1 | tee ../logs/prepare.txt; fi
          flutter pub get 2>&1 | tee ../logs/pubget.txt
      - name: Analisar codigo
        shell: bash
        working-directory: app
        continue-on-error: true
        run: flutter analyze --no-fatal-infos 2>&1 | tee ../logs/analyze.txt
      - name: Rodar testes
        shell: bash
        working-directory: app
        continue-on-error: true
        run: flutter test 2>&1 | tee ../logs/test.txt
      - name: Compilar APK
        shell: bash
        working-directory: app
        run: |
          if [ -f tool/ci_build_android.sh ]; then bash tool/ci_build_android.sh; else flutter build apk --release 2>&1 | tee ../logs/build.txt; fi
      - name: Publicar logs no repositorio
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f logs
          git commit -m "Logs da compilacao Android" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: KAIO-MUSIC-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-android
          path: logs

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar projeto
        shell: pwsh
        run: |
          Expand-Archive projeto.zip -DestinationPath app
          cd app
          flutter create --platforms=android,windows --project-name kaio_music --org com.kaio .
          Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue
          flutter pub get
      - name: Compilar Windows
        working-directory: app
        run: flutter build windows --release
      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath KAIO-MUSIC-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KAIO-MUSIC-windows
          path: KAIO-MUSIC-windows.zip
