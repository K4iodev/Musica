name: Build KAIO MUSIC

on:
  workflow_dispatch:
  push:
    paths:
      - projeto.zip
      - .github/workflows/build.yml

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar projeto
        shell: bash
        run: |
          unzip -q projeto.zip -d app
          cd app
          flutter create --platforms=android,windows --project-name kaio_music --org com.kaio .
          rm -f test/widget_test.dart
          flutter pub get
      - name: Analisar codigo
        shell: bash
        working-directory: app
        continue-on-error: true
        run: flutter analyze 2>&1 | tee ../analyze.txt
      - name: Rodar testes
        shell: bash
        working-directory: app
        continue-on-error: true
        run: flutter test 2>&1 | tee ../test.txt
      - name: Compilar APK
        working-directory: app
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: KAIO-MUSIC-android
          path: app/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorios-android
          path: |
            analyze.txt
            test.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Preparar projeto
        shell: pwsh
        run: |
          Expand-Archive projeto.zip -DestinationPath app
          cd app
          flutter create --platforms=android,windows --project-name kaio_music --org com.kaio .
          Remove-Item test/widget_test.dart -ErrorAction SilentlyContinue
          flutter pub get
      - name: Compilar Windows
        working-directory: app
        run: flutter build windows --release
      - name: Compactar
        shell: pwsh
        run: Compress-Archive -Path app/build/windows/x64/runner/Release/* -DestinationPath KAIO-MUSIC-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: KAIO-MUSIC-windows
          path: KAIO-MUSIC-windows.zip
